name: Release

# 推送 v* 标签时自动构建并发布到 GitHub Release。
# 不包含任何密钥:electron-builder 用的是 GitHub Actions 自带的 GITHUB_TOKEN。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (NSIS installer + portable)
        run: npx electron-builder --win --x64 --publish never

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*Setup*.exe
            dist/*Portable*.exe
            dist/*.blockmap
          draft: false
          generate_release_notes: true

      - name: Upload build output (debug)
        uses: actions/upload-artifact@v4
        with:
          name: naidan-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: warn

  build-macos:
    name: macOS (dmg + zip) — optional
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          draft: false
